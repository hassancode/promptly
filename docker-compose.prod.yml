version: '3.8'

# =============================================================================
# Promptly Production Docker Compose Override
# Task: T220 [Phase 9]
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides development settings for production deployment.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Production)
  # ---------------------------------------------------------------------------
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Required in production
    ports: []  # Don't expose database port in production
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis Cache & Session Store (Production)
  # ---------------------------------------------------------------------------
  redis:
    ports: []  # Don't expose Redis port in production
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # FastAPI Backend (Production with Gunicorn)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    environment:
      - DATABASE_URL=postgresql://promptly:${POSTGRES_PASSWORD}@postgres:5432/promptly
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY}  # Required in production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - PYTHONPATH=/app/src
    volumes: []  # Don't mount source in production
    # Gunicorn with Uvicorn workers for production
    command: >
      gunicorn main:app
      --workers ${GUNICORN_WORKERS:-4}
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --keep-alive 5
      --access-logfile -
      --error-logfile -
      --capture-output
      --enable-stdio-inheritance
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
      replicas: ${API_REPLICAS:-1}

  # ---------------------------------------------------------------------------
  # Next.js Frontend (Production)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
    volumes: []  # Don't mount source in production
    command: npm start
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      replicas: ${WEB_REPLICAS:-1}

# =============================================================================
# Production Volume Configuration
# Consider using external volumes or cloud storage in production
# =============================================================================
